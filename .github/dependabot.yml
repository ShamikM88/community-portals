version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # Portals ship no lockfile, so a major bump changes what every fresh install resolves.
  - package-ecosystem: "npm"
    directories: ["/portals/*/*/cli"]
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      portal-deps:
        patterns: ["*"]
