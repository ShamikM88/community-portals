# Adapted from the security-guards job in ai-job-search-dev/ai-job-search's ci.yml.
# Portals ship CLI code and skill frontmatter that every fork user executes,
# so this job fails PRs that add package lifecycle scripts or install config,
# widen a skill's allowed-tools beyond its own CLI, or leave a portal folder
# without exactly one CODEOWNERS line. Honest limit: a PR can
# edit this workflow itself, so these guards catch accidents and casual
# attempts, not a determined author - branch protection with required checks
# and human review remain the real backstop.

name: Security guards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-guards:
    name: Security guards (manifests, skill frontmatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py
      - run: python -m unittest discover -s tests -v
