# Pinned, hash-verified Betterleaks binary instead of an unvetted third-party action; validation stays off so found secrets are never sent to live services.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    name: Betterleaks
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        run: |
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$tarball"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan commits added by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: betterleaks git . --log-opts="$BASE_SHA..$HEAD_SHA" --validation=false --ignore-gitleaks-allow --redact -v --no-banner
      - name: Scan full history
        if: github.event_name == 'push'
        run: betterleaks git . --log-opts=HEAD --validation=false --ignore-gitleaks-allow --redact -v --no-banner
